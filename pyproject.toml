[project]
name = "sentinelops"
version = "0.1.0"
description = "SentinelOps: Autonomous AI Operations & Incident Remediation Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "sentence-transformers>=3.0.0",
    "qdrant-client>=1.9.0",
    "rank-bm25>=0.2.2",
    "networkx>=3.3",
    "mcp>=0.1.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ragas>=0.1.9",
    "langsmith>=0.1.75",
    "black>=24.4.2",
    "ruff>=0.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
