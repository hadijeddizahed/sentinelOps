version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: sentinelops-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  postgres:
    image: postgres:16-alpine
    container_name: sentinelops-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sentinelops
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: sentinelops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    container_name: sentinelops-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=postgresql://sentinel:sentinel_password@postgres:5432/sentinelops
    depends_on:
      - qdrant
      - postgres

volumes:
  qdrant_storage:
  postgres_data:
